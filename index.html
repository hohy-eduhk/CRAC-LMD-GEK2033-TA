<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRAC-LMD-GEK2033 課程助教</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
    }
    #chat-box {
      border: 1px solid #ccc;
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .message {
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .user { color: #0056b3; font-weight: bold; }
    .assistant { color: #155724; }
    .system-status { color: #856404; background-color: #fff3cd; padding: 5px; margin-bottom: 10px; border-radius: 3px; }
    .error { color: #721c24; background-color: #f8d7da; padding: 5px; margin-bottom: 10px; border-radius: 3px; }
    
    /* 預設建議問題按鈕區塊樣式 */
    #suggested-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      min-height: 32px;
    }
    .suggest-btn {
      background-color: #e9ecef;
      color: #495057;
      border: 1px solid #ced4da;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .suggest-btn:hover {
      background-color: #007bff;
      color: white;
      border-color: #007bff;
    }
    .suggest-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #input-container { display: flex; gap: 10px; }
    #user-input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
    #send-btn { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #send-btn:disabled { background-color: #cccccc; cursor: not-allowed; }
  </style>

  <!-- 引入 WebLLM SDK -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    let docContext = "";
    const chatHistory = [];
    
    // 使用官方預設支援的輕量模型
    const SELECTED_MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";

    // 頁面載入完成後自動初始化
    window.addEventListener("DOMContentLoaded", async () => {
      await loadMaterials();
      await initWebLLM();
    });

    // 1. 載入教材檔案
    async function loadMaterials() {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "⏳ 正在載入教材檔案...";

      try {
        const fetchDoc = async (filename) => {
          const res = await fetch(`data/${filename}`);
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return await res.text();
        };

        const [d1, d2, d3] = await Promise.all([
          fetchDoc("doc1.txt").catch(() => ""),
          fetchDoc("doc2.txt").catch(() => ""),
          fetchDoc("doc3.txt").catch(() => "")
        ]);

        const MAX_CHAR_PER_DOC = 1000;
        docContext = `
【教材一】: ${d1.slice(0, MAX_CHAR_PER_DOC)}
【教材二】: ${d2.slice(0, MAX_CHAR_PER_DOC)}
【教材三】: ${d3.slice(0, MAX_CHAR_PER_DOC)}
        `.trim();

        statusDiv.innerText = "✅ 教材載入成功！正在初始化 AI 引擎...";
      } catch (err) {
        console.error("教材載入失敗:", err);
        showStatus("⚠️ 教材載入失敗，請確認 data/ 資料夾下是否有 doc1.txt, doc2.txt, doc3.txt", "error");
      }
    }

    // 2. 初始化 WebLLM 引擎
    async function initWebLLM() {
      const statusDiv = document.getElementById("status");
      try {
        const initProgressCallback = (report) => {
          statusDiv.innerText = `⏳ 載入 AI 模型中: ${report.text}`;
        };

        engine = await webllm.CreateMLCEngine(SELECTED_MODEL, {
          initProgressCallback: initProgressCallback,
        });

        statusDiv.innerText = "🚀 AI 模組準備就緒，可以點擊下方建議問題或自行輸入！";
        
        // 顯示 Opening Text（開場白）
        const openingText = "我是你GEK2033課程的助教，你可以問我有關文化安全和文化保育的問題，我會盡量解答的！";
        appendMessage("assistant", `課程助教：${openingText}`);
        chatHistory.push({ role: "assistant", content: openingText });

        document.getElementById("send-btn").disabled = false;
        toggleSuggestButtons(false);
      } catch (err) {
        console.error("WebGPU / 模型初始化失敗:", err);
        showStatus("❌ AI 模組啟動失敗，請確保瀏覽器支援 WebGPU 並已開啟硬體加速 (建議使用 Chrome/Edge)。", "error");
      }
    }

    // 3. 發送訊息邏輯
    window.sendMessage = async function (customText = null) {
      const inputEl = document.getElementById("user-input");
      const userText = customText || inputEl.value.trim();
      if (!userText || !engine) return;

      inputEl.value = "";
      appendMessage("user", `你：${userText}`);
      
      document.getElementById("send-btn").disabled = true;
      toggleSuggestButtons(true);

      chatHistory.push({ role: "user", content: userText });
      const aiMessageEl = appendMessage("assistant", "課程助教：思考中...");

      try {
        const systemPrompt = `你是一名嚴謹專業的課程助教 (CRAC-LMD-GEK2033-TA)。
請遵守以下回答規則：
1. 請務必綜合並整合以下提供的三份教材內容進行條理分明的回答。
2. 回答請保持簡明扼要，重點突出，總字數嚴格限制在 500 字以內。
3. 若教材中未提及相關內容，請明確說明並給出合理的學習引導。

【教材資料】:
${docContext}`;
        
        const MAX_HISTORY = 4;
        const recentHistory = chatHistory.slice(-MAX_HISTORY);

        const messages = [
          { role: "system", content: systemPrompt },
          ...recentHistory
        ];

        const completion = await engine.chat.completions.create({
          messages: messages,
          stream: true,
          temperature: 0.6,
          max_tokens: 650,
        });

        let fullResponse = "";
        for await (const chunk of completion) {
          const delta = chunk.choices[0]?.delta?.content || "";
          fullResponse += delta;
          aiMessageEl.innerText = `課程助教：${fullResponse}`;
          scrollChatToBottom();
        }

        chatHistory.push({ role: "assistant", content: fullResponse });

        // 🌟 自動生成延伸建議問題
        await generateFollowUpQuestions(userText, fullResponse);

      } catch (error) {
        console.error("生成錯誤:", error);
        aiMessageEl.innerText = "課程助教：[回答生成中斷，請重試]";
        aiMessageEl.classList.add("error");
      } finally {
        document.getElementById("send-btn").disabled = false;
        toggleSuggestButtons(false);
      }
    };

    // 4. 動態生成建議問題的邏輯
    async function generateFollowUpQuestions(lastUserQuery, lastAiResponse) {
      try {
        const prompt = `根據使用者提問：「${lastUserQuery}」與你的回答：「${lastAiResponse}」，請生成 3 個使用者可能會想繼續追問的簡短問題。
要求：
1. 每個問題必須簡短（20字以內）。
2. 只需輸出 3 個問題，每行一個問題。
3. 格式必須嚴格遵守：
Q1: 問題一
Q2: 問題二
Q3: 問題三`;

        const response = await engine.chat.completions.create({
          messages: [{ role: "user", content: prompt }],
          max_tokens: 150,
          temperature: 0.7,
        });

        const text = response.choices[0]?.message?.content || "";
        const lines = text.split("\n").map(l => l.trim()).filter(l => l.startsWith("Q"));
        
        const newQuestions = lines.map(l => l.replace(/^Q\d+[:：]\s*/, "")).slice(0, 3);

        if (newQuestions.length > 0) {
          renderSuggestedQuestions(newQuestions);
        }
      } catch (err) {
        console.warn("無法生成後續建議問題:", err);
      }
    }

    // 渲染 / 更新建議按鈕介面
    function renderSuggestedQuestions(questions) {
      const container = document.getElementById("suggested-questions");
      container.innerHTML = ""; // 清空舊的按鈕

      questions.forEach(q => {
        const btn = document.createElement("button");
        btn.className = "suggest-btn";
        btn.innerText = `💡 ${q}`;
        btn.onclick = () => window.askQuestion(q);
        container.appendChild(btn);
      });
    }

    // 5. 點擊預設建議問題的處理函式
    window.askQuestion = function (questionText) {
      window.sendMessage(questionText);
    };

    function toggleSuggestButtons(disabled) {
      const buttons = document.querySelectorAll(".suggest-btn");
      buttons.forEach(btn => btn.disabled = disabled);
    }

    function appendMessage(role, text) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      scrollChatToBottom();
      return msgDiv;
    }

    function scrollChatToBottom() {
      const chatBox = document.getElementById("chat-box");
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showStatus(text, type) {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = text;
      statusDiv.className = type === "error" ? "error" : "system-status";
    }
  </script>
</head>
<body>

  <h2>🎓 課程助教 AI 問答系統</h2>
  <div id="status" class="system-status">正在載入系統中...</div>

  <div id="chat-box"></div>

  <!-- 預設與動態建議問題按鈕區塊 -->
  <div id="suggested-questions">
    <button class="suggest-btn" onclick="askQuestion('甚麼是文化挪用？')" disabled>💡 甚麼是文化挪用？</button>
    <button class="suggest-btn" onclick="askQuestion('甚麼是文化保育？')" disabled>💡 甚麼是文化保育？</button>
    <button class="suggest-btn" onclick="askQuestion('甚麼是文化安全？')" disabled>💡 甚麼是文化安全？</button>
    <button class="suggest-btn" onclick="askQuestion('文化挪用與三國志有甚麼關係？')" disabled>💡 文化挪用與三國志有甚麼關係？</button>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="請輸入關於課程的問題..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button id="send-btn" onclick="sendMessage()" disabled>發送</button>
  </div>

</body>
</html>
