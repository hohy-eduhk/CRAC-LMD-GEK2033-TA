<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRAC-LMD-GEK2033 課程助教</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
    }
    #chat-box {
      border: 1px solid #ccc;
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .message {
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .user { color: #0056b3; font-weight: bold; }
    .assistant { color: #155724; }
    .system-status { color: #856404; background-color: #fff3cd; padding: 5px; margin-bottom: 10px; border-radius: 3px; }
    .error { color: #721c24; background-color: #f8d7da; padding: 5px; margin-bottom: 10px; border-radius: 3px; }
    #input-container { display: flex; gap: 10px; }
    #user-input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
    button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
  </style>

  <!-- 引入 WebLLM SDK (Module 形式) -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    let docContext = "";
    const chatHistory = [];
    
    // 設定模型（可根據需求調整，建議選擇輕量量化模型）
    const SELECTED_MODEL = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";

    // 頁面載入完成後自動初始化
    window.addEventListener("DOMContentLoaded", async () => {
      await loadMaterials();
      await initWebLLM();
    });

    // 1. 載入教材檔案 (處理路徑與字數截斷)
    async function loadMaterials() {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "⏳ 正在載入教材檔案...";

      try {
        // 請確保 GitHub 倉庫根目錄下有 data/ 資料夾
        const fetchDoc = async (filename) => {
          const res = await fetch(`data/${filename}`);
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return await res.text();
        };

        const [d1, d2, d3] = await Promise.all([
          fetchDoc("doc1.txt").catch(() => ""),
          fetchDoc("doc2.txt").catch(() => ""),
          fetchDoc("doc3.txt").catch(() => "")
        ]);

        // ⚠️ 【關鍵修正 1】限制每個教材最大字數，避免超過 Context Window
        const MAX_CHAR_PER_DOC = 1000;
        docContext = `
【教材一】: ${d1.slice(0, MAX_CHAR_PER_DOC)}
【教材二】: ${d2.slice(0, MAX_CHAR_PER_DOC)}
【教材三】: ${d3.slice(0, MAX_CHAR_PER_DOC)}
        `.trim();

        statusDiv.innerText = "✅ 教材載入成功！正在初始化 AI 引擎...";
      } catch (err) {
        console.error("教材載入失敗:", err);
        showStatus("⚠️ 教材載入失敗，請確認 data/ 資料夾下是否有 doc1.txt, doc2.txt, doc3.txt", "error");
      }
    }

    // 2. 初始化 WebLLM 引擎
    async function initWebLLM() {
      const statusDiv = document.getElementById("status");
      try {
        const initProgressCallback = (report) => {
          statusDiv.innerText = `⏳ 載入 AI 模型中: ${report.text}`;
        };

        // 初始化 MLCEngine
        engine = await webllm.CreateMLCEngine(SELECTED_MODEL, {
          initProgressCallback: initProgressCallback,
          // ⚠️ 【關鍵修正 2】手動將 context_window_size 調大（若顯存允許）
          appConfig: {
            model_list: [
              {
                model: `https://huggingface.co/mlc-ai/${SELECTED_MODEL}`,
                model_id: SELECTED_MODEL,
                overrides: {
                  context_window_size: 8192,
                },
              },
            ],
          },
        });

        statusDiv.innerText = "🚀 AI 模組準備就緒，可以開始提問囉！";
        document.getElementById("send-btn").disabled = false;
      } catch (err) {
        console.error("WebGPU / 模型初始化失敗:", err);
        showStatus("❌ AI 模組啟動失敗，請確保瀏覽器支援 WebGPU 並已開啟硬體加速 (建議使用 Chrome/Edge)。", "error");
      }
    }

    // 3. 發送訊息邏輯
    window.sendMessage = async function () {
      const inputEl = document.getElementById("user-input");
      const userText = inputEl.value.trim();
      if (!userText || !engine) return;

      inputEl.value = "";
      appendMessage("user", `你：${userText}`);
      document.getElementById("send-btn").disabled = true;

      // 將使用者輸入寫入紀錄
      chatHistory.push({ role: "user", content: userText });

      // 建立對話框給 AI 填寫 Stream 回應
      const aiMessageEl = appendMessage("assistant", "課程助教：思考中...");

      try {
        // 建立完整的 System Prompt
        const systemPrompt = `你是一名嚴謹專業的課程助教 (CRAC-LMD-GEK2033-TA)。請優先根據以下提供的教材內容回答問題。如果教材中沒有提及，請優雅地說明並給出合理的引導。\n\n${docContext}`;

        // ⚠️ 【關鍵修正 3】只取最新的 4 則對話歷史，防止 Token 累積過長
        const MAX_HISTORY = 4;
        const recentHistory = chatHistory.slice(-MAX_HISTORY);

        const messages = [
          { role: "system", content: systemPrompt },
          ...recentHistory
        ];

        // 呼叫 WebLLM 進行串流生成
        const completion = await engine.chat.completions.create({
          messages: messages,
          stream: true,
          temperature: 0.7,
          max_tokens: 512, // 限制單次生成的最大 Token 數量
        });

        let fullResponse = "";
        for await (const chunk of completion) {
          const delta = chunk.choices[0]?.delta?.content || "";
          fullResponse += delta;
          aiMessageEl.innerText = `課程助教：${fullResponse}`;
          scrollChatToBottom();
        }

        // 紀錄 AI 回應至歷史
        chatHistory.push({ role: "assistant", content: fullResponse });

      } catch (error) {
        console.error("生成錯誤:", error);
        aiMessageEl.innerText = "課程助教：[回答生成中斷，請重試]";
        aiMessageEl.classList.add("error");
      } finally {
        document.getElementById("send-btn").disabled = false;
      }
    };

    // UI 輔助函式
    function appendMessage(role, text) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      scrollChatToBottom();
      return msgDiv;
    }

    function scrollChatToBottom() {
      const chatBox = document.getElementById("chat-box");
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showStatus(text, type) {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = text;
      statusDiv.className = type === "error" ? "error" : "system-status";
    }
  </script>
</head>
<body>

  <h2>🎓 課程助教 AI 問答系統</h2>
  <div id="status" class="system-status">正在載入系統中...</div>

  <div id="chat-box"></div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="請輸入關於課程的問題..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button id="send-btn" onclick="sendMessage()" disabled>發送</button>
  </div>

</body>
</html>
