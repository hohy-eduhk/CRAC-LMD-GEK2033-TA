<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEK2033 課程助教 Chatbot</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; background: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    #status { font-weight: bold; color: #d97706; margin-bottom: 10px; }
    #chat-box { height: 380px; border: 1px solid #e5e7eb; overflow-y: auto; padding: 15px; border-radius: 6px; background: #fafafa; margin-bottom: 12px; }
    .msg { margin-bottom: 12px; line-height: 1.6; }
    .user { color: #1e40af; font-weight: 600; }
    .bot { color: #065f46; white-space: pre-wrap; }
    .system-msg { color: #6b7280; font-style: italic; font-size: 0.9em; }
    
    /* 預設問題按鈕樣式 */
    .preset-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .preset-btn { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; padding: 6px 12px; border-radius: 16px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .preset-btn:hover { background: #dbeafe; border-color: #93c5fd; }
    .preset-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .input-area { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button.send-btn { padding: 10px 20px; background: #1e40af; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button.send-btn:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    let fullKnowledgeBase = "";
    const selectedModel = "Llama-3.1-8B-Instruct-q4f16_1-MLC";

    // 自動從 data/ 資料夾載入三份教材
    async function loadKnowledgeBase() {
      const statusEl = document.getElementById("status");
      statusEl.innerText = "⏳ 正在讀取教材資料庫...";
      try {
        const [res1, res2, res3] = await Promise.all([
          fetch('./data/01_GEK2033_例子一_三國演義教材_20260521.txt'),
          fetch('./data/02_GEK2033_例子二_文化保育20260519.txt'),
          fetch('./data/03_GEK2033_2020年全國性法律公布——中華人民共和國香港特別行政區維護國家安全.txt')
        ]);

        if (!res1.ok || !res2.ok || !res3.ok) {
          throw new Error("無法讀取教材檔案，請確認 data/doc1.txt, doc2.txt, doc3.txt 是否已上傳。");
        }

        const doc1 = await res1.text();
        const doc2 = await res2.text();
        const doc3 = await res3.text();

        fullKnowledgeBase = `【教材一】\n${doc1}\n\n【教材二】\n${doc2}\n\n【教材三】\n${doc3}`;
        statusEl.innerText = "✅ 教材載入成功！正在初始化 AI 模型...";
        return true;
      } catch (err) {
        statusEl.innerText = `❌ 教材載入失敗：${err.message}`;
        statusEl.style.color = "#dc2626";
        return false;
      }
    }

    window.initEngine = async function() {
      const statusEl = document.getElementById("status");
      const sendBtn = document.getElementById("send-btn");
      const presetBtns = document.querySelectorAll(".preset-btn");
      const chatBox = document.getElementById("chat-box");

      const loaded = await loadKnowledgeBase();
      if (!loaded) return;

      try {
        engine = await webllm.CreateMLCEngine(selectedModel, {
          initProgressCallback: (progress) => {
            statusEl.innerText = `⏳ AI 模型載入中: ${progress.text}`;
          }
        });

        statusEl.innerText = "🎓 助教已上線！你可以點擊下方快捷問題或直接輸入提問。";
        statusEl.style.color = "#059669";
        
        // 模型載入完畢後，讓助教自動發送開場招呼語
        chatBox.innerHTML += `<div class="msg bot">👩‍🏫 課程助教：我是你 GEK2033 課程的助教，你可以問我有關文化安全和文化保育的問題啊，我會盡量解答的！</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        sendBtn.disabled = false;
        presetBtns.forEach(btn => btn.disabled = false);
      } catch (err) {
        statusEl.innerText = "❌ AI 模組啟動失敗，請確保瀏覽器支援 WebGPU (建議使用 Chrome 或 Edge)。";
        statusEl.style.color = "#dc2626";
        console.error(err);
      }
    };

    // 點擊快捷問題時調用
    window.askPreset = function(questionText) {
      const inputEl = document.getElementById("user-input");
      inputEl.value = questionText;
      window.sendMessage();
    };

    window.sendMessage = async function() {
      const inputEl = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");
      const sendBtn = document.getElementById("send-btn");
      const presetBtns = document.querySelectorAll(".preset-btn");
      const question = inputEl.value.trim();

      if (!question || !engine) return;

      chatBox.innerHTML += `<div class="msg user">🎓 學生：${question}</div>`;
      inputEl.value = "";
      
      // 鎖定按鈕避免重複觸發
      sendBtn.disabled = true;
      presetBtns.forEach(btn => btn.disabled = true);

      // 嚴格助教 Prompt 控制
      const systemPrompt = `你是一位 GEK2033 大學國安教育與文化保育課程的專屬助教。你的語氣專業、耐心且具啟發性，專門幫助學生理解香港國安教育中文化安全部分，並透過理解傳統文學作品《三國志》及其衍生作品與文化挪用，以及各地文化保育的相關知識。

【嚴格規則】：
1. 當學生提問時，必須「僅限」使用下方的【課程教材】內容來回答。
2. 若教材中有相關案例（如香港藍屋、上博楚簡、日本三國遊戲等），請優先引用這些案例來解釋概念。
3. 如果學生的問題超出了教材範圍，請禮貌回覆：「這部分不在我們目前的教材範圍內喔！你想了解教材中的『文化挪用』還是『文物保育』呢？」
4. 絕對不要自己編造或在網上搜尋教材以外的知識或歷史細節。

【課程教材】：
${fullKnowledgeBase}`;

      const messages = [
        { role: "system", content: systemPrompt },
        { role: "user", content: question }
      ];

      const botMsgDiv = document.createElement("div");
      botMsgDiv.className = "msg bot";
      botMsgDiv.innerText = "👩‍🏫 課程助教：";
      chatBox.appendChild(botMsgDiv);

      try {
        const completion = await engine.chat.completions.create({
          messages,
          stream: true,
          temperature: 0.1
        });

        for await (const chunk of completion) {
          const delta = chunk.choices[0]?.delta?.content || "";
          botMsgDiv.innerText += delta;
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      } catch (error) {
        botMsgDiv.innerText += "\n[回答生成中斷，請重試]";
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        presetBtns.forEach(btn => btn.disabled = false);
      }
    };

    window.addEventListener("DOMContentLoaded", () => {
      window.initEngine();
    });
  </script>
</head>
<body>

  <div class="card">
    <h2>🏛️ GEK2033 線上課程助教</h2>
    <p>歡迎使用課程專屬 Chatbot，請點擊常見問題或直接輸入提問。</p>
    <div id="status">準備中...</div>
  </div>

  <div class="card">
    <div id="chat-box">
      <div class="msg system-msg">系統提示：助教將僅依據課程教材（包含國安文化安全、《三國志》衍生文化挪用、藍屋與上博楚簡等案例）為你解答。</div>
    </div>

    <!-- 預設快捷問題按鈕區域 -->
    <div class="preset-container">
      <button class="preset-btn" onclick="askPreset('甚麼是文化挪用？')" disabled>💡 甚麼是文化挪用？</button>
      <button class="preset-btn" onclick="askPreset('甚麼是文化保育？')" disabled>💡 甚麼是文化保育？</button>
      <button class="preset-btn" onclick="askPreset('甚麼是文化安全？')" disabled>💡 甚麼是文化安全？</button>
      <button class="preset-btn" onclick="askPreset('文化挪用與三國志有甚麼關係？')" disabled>💡 文化挪用與三國志有甚麼關係？</button>
    </div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="請輸入你的問題..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="send-btn" class="send-btn" onclick="sendMessage()" disabled>發送</button>
    </div>
  </div>

</body>
</html>
